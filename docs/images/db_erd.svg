<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .grid { stroke: #e3e8ee; stroke-width: 1; }
      .table { fill: #ffffff; stroke: #8aa1b4; stroke-width: 2; rx: 8; }
      .head { fill: #8eb6d6; stroke: #6f93ad; stroke-width: 2; }
      .title { font: 700 20px Arial, sans-serif; fill: #102536; }
      .field { font: 15px Arial, sans-serif; fill: #1f2933; }
      .pk { fill: #f4b942; }
      .fk { fill: #e46d6d; }
      .col { fill: #53b7c9; }
      .rel { fill: none; stroke: #34495e; stroke-width: 2.5; }
      .note { font: 18px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1050"/>

  <g opacity="0.75">
    <path class="grid" d="M0 50H1600M0 100H1600M0 150H1600M0 200H1600M0 250H1600M0 300H1600M0 350H1600M0 400H1600M0 450H1600M0 500H1600M0 550H1600M0 600H1600M0 650H1600M0 700H1600M0 750H1600M0 800H1600M0 850H1600M0 900H1600M0 950H1600M0 1000H1600"/>
    <path class="grid" d="M50 0V1050M100 0V1050M150 0V1050M200 0V1050M250 0V1050M300 0V1050M350 0V1050M400 0V1050M450 0V1050M500 0V1050M550 0V1050M600 0V1050M650 0V1050M700 0V1050M750 0V1050M800 0V1050M850 0V1050M900 0V1050M950 0V1050M1000 0V1050M1050 0V1050M1100 0V1050M1150 0V1050M1200 0V1050M1250 0V1050M1300 0V1050M1350 0V1050M1400 0V1050M1450 0V1050M1500 0V1050M1550 0V1050"/>
  </g>

  <text x="40" y="42" class="title">stock_prediction_db ERD</text>
  <text x="40" y="72" class="note">사용자 보유 주식, 현재가, 뉴스 감성 분석, 예측 결과, 최종 리포트를 연결한 데이터베이스 구조</text>

  <!-- relationship lines -->
  <path class="rel" d="M405 705 H560"/>
  <path class="rel" d="M405 565 H560"/>
  <path class="rel" d="M775 575 H920 V415 H1060"/>
  <path class="rel" d="M775 575 H920 V640 H1060"/>
  <path class="rel" d="M775 575 H925 V875 H1010"/>
  <path class="rel" d="M775 575 H920 V205 H1060"/>
  <path class="rel" d="M775 735 H920 V245 H1060"/>
  <path class="rel" d="M1275 520 V680"/>
  <path class="rel" d="M405 255 H560 V445"/>

  <!-- stock_predictions -->
  <g transform="translate(80 120)">
    <rect class="table" width="325" height="310"/>
    <rect class="head" width="325" height="42"/>
    <text x="18" y="27" class="title">stock_predictions</text>
    <circle class="pk" cx="18" cy="65" r="6"/><text x="35" y="70" class="field">prediction_id BIGINT PK</text>
    <circle class="fk" cx="18" cy="92" r="6"/><text x="35" y="97" class="field">stock_id BIGINT FK</text>
    <circle class="col" cx="18" cy="119" r="6"/><text x="35" y="124" class="field">prediction_date DATE</text>
    <circle class="col" cx="18" cy="146" r="6"/><text x="35" y="151" class="field">prediction_direction ENUM</text>
    <circle class="col" cx="18" cy="173" r="6"/><text x="35" y="178" class="field">predicted_change_rate DECIMAL</text>
    <circle class="col" cx="18" cy="200" r="6"/><text x="35" y="205" class="field">predicted_price DECIMAL</text>
    <circle class="col" cx="18" cy="227" r="6"/><text x="35" y="232" class="field">sentiment_avg_score DECIMAL</text>
    <circle class="col" cx="18" cy="254" r="6"/><text x="35" y="259" class="field">confidence DECIMAL</text>
    <circle class="col" cx="18" cy="281" r="6"/><text x="35" y="286" class="field">model_name, model_version</text>
  </g>

  <!-- stock_prices -->
  <g transform="translate(80 500)">
    <rect class="table" width="325" height="305"/>
    <rect class="head" width="325" height="42"/>
    <text x="18" y="27" class="title">stock_prices</text>
    <circle class="pk" cx="18" cy="65" r="6"/><text x="35" y="70" class="field">price_id BIGINT PK</text>
    <circle class="fk" cx="18" cy="92" r="6"/><text x="35" y="97" class="field">stock_id BIGINT FK</text>
    <circle class="col" cx="18" cy="119" r="6"/><text x="35" y="124" class="field">current_price DECIMAL</text>
    <circle class="col" cx="18" cy="146" r="6"/><text x="35" y="151" class="field">open/high/low/close price</text>
    <circle class="col" cx="18" cy="173" r="6"/><text x="35" y="178" class="field">trading_volume BIGINT</text>
    <circle class="col" cx="18" cy="200" r="6"/><text x="35" y="205" class="field">source VARCHAR</text>
    <circle class="col" cx="18" cy="227" r="6"/><text x="35" y="232" class="field">collected_at DATETIME</text>
    <circle class="col" cx="18" cy="254" r="6"/><text x="35" y="259" class="field">created_at, updated_at</text>
  </g>

  <!-- stocks -->
  <g transform="translate(560 445)">
    <rect class="table" width="300" height="245"/>
    <rect class="head" width="300" height="42"/>
    <text x="18" y="27" class="title">stocks</text>
    <circle class="pk" cx="18" cy="65" r="6"/><text x="35" y="70" class="field">stock_id BIGINT PK</text>
    <circle class="col" cx="18" cy="92" r="6"/><text x="35" y="97" class="field">stock_code VARCHAR UK</text>
    <circle class="col" cx="18" cy="119" r="6"/><text x="35" y="124" class="field">stock_name VARCHAR</text>
    <circle class="col" cx="18" cy="146" r="6"/><text x="35" y="151" class="field">market ENUM</text>
    <circle class="col" cx="18" cy="173" r="6"/><text x="35" y="178" class="field">currency CHAR</text>
    <circle class="col" cx="18" cy="200" r="6"/><text x="35" y="205" class="field">sector VARCHAR</text>
    <circle class="col" cx="18" cy="227" r="6"/><text x="35" y="232" class="field">created_at, updated_at</text>
  </g>

  <!-- users -->
  <g transform="translate(560 720)">
    <rect class="table" width="300" height="245"/>
    <rect class="head" width="300" height="42"/>
    <text x="18" y="27" class="title">users</text>
    <circle class="pk" cx="18" cy="65" r="6"/><text x="35" y="70" class="field">user_id BIGINT PK</text>
    <circle class="col" cx="18" cy="92" r="6"/><text x="35" y="97" class="field">username VARCHAR UK</text>
    <circle class="col" cx="18" cy="119" r="6"/><text x="35" y="124" class="field">email VARCHAR UK</text>
    <circle class="col" cx="18" cy="146" r="6"/><text x="35" y="151" class="field">password_hash VARCHAR</text>
    <circle class="col" cx="18" cy="173" r="6"/><text x="35" y="178" class="field">full_name VARCHAR</text>
    <circle class="col" cx="18" cy="200" r="6"/><text x="35" y="205" class="field">phone_number VARCHAR</text>
    <circle class="col" cx="18" cy="227" r="6"/><text x="35" y="232" class="field">created_at, updated_at</text>
  </g>

  <!-- user_holdings -->
  <g transform="translate(1060 120)">
    <rect class="table" width="335" height="300"/>
    <rect class="head" width="335" height="42"/>
    <text x="18" y="27" class="title">user_holdings</text>
    <circle class="pk" cx="18" cy="65" r="6"/><text x="35" y="70" class="field">holding_id BIGINT PK</text>
    <circle class="fk" cx="18" cy="92" r="6"/><text x="35" y="97" class="field">user_id BIGINT FK</text>
    <circle class="fk" cx="18" cy="119" r="6"/><text x="35" y="124" class="field">stock_id BIGINT FK</text>
    <circle class="col" cx="18" cy="146" r="6"/><text x="35" y="151" class="field">quantity DECIMAL</text>
    <circle class="col" cx="18" cy="173" r="6"/><text x="35" y="178" class="field">average_buy_price DECIMAL</text>
    <circle class="col" cx="18" cy="200" r="6"/><text x="35" y="205" class="field">buy_date DATE</text>
    <circle class="col" cx="18" cy="227" r="6"/><text x="35" y="232" class="field">memo VARCHAR</text>
    <circle class="col" cx="18" cy="254" r="6"/><text x="35" y="259" class="field">created_at, updated_at</text>
  </g>

  <!-- user_reports -->
  <g transform="translate(1060 455)">
    <rect class="table" width="360" height="295"/>
    <rect class="head" width="360" height="42"/>
    <text x="18" y="27" class="title">user_reports</text>
    <circle class="pk" cx="18" cy="65" r="6"/><text x="35" y="70" class="field">report_id BIGINT PK</text>
    <circle class="fk" cx="18" cy="92" r="6"/><text x="35" y="97" class="field">user_id BIGINT FK</text>
    <circle class="fk" cx="18" cy="119" r="6"/><text x="35" y="124" class="field">stock_id BIGINT FK</text>
    <circle class="fk" cx="18" cy="146" r="6"/><text x="35" y="151" class="field">prediction_id BIGINT FK</text>
    <circle class="col" cx="18" cy="173" r="6"/><text x="35" y="178" class="field">report_title VARCHAR</text>
    <circle class="col" cx="18" cy="200" r="6"/><text x="35" y="205" class="field">report_content TEXT</text>
    <circle class="col" cx="18" cy="227" r="6"/><text x="35" y="232" class="field">profit_rate, profit_amount</text>
    <circle class="col" cx="18" cy="254" r="6"/><text x="35" y="259" class="field">recommendation, generated_at</text>
  </g>

  <!-- news_articles -->
  <g transform="translate(1060 790)">
    <rect class="table" width="360" height="220"/>
    <rect class="head" width="360" height="42"/>
    <text x="18" y="27" class="title">news_articles</text>
    <circle class="pk" cx="18" cy="65" r="6"/><text x="35" y="70" class="field">article_id BIGINT PK</text>
    <circle class="fk" cx="18" cy="92" r="6"/><text x="35" y="97" class="field">stock_id BIGINT FK</text>
    <circle class="col" cx="18" cy="119" r="6"/><text x="35" y="124" class="field">title, summary, url</text>
    <circle class="col" cx="18" cy="146" r="6"/><text x="35" y="151" class="field">url_hash CHAR UK</text>
    <circle class="col" cx="18" cy="173" r="6"/><text x="35" y="178" class="field">publisher, published_at</text>
    <circle class="col" cx="18" cy="200" r="6"/><text x="35" y="205" class="field">collected_at</text>
  </g>

  <!-- sentiment_analysis -->
  <g transform="translate(1230 790)">
    <rect class="table" width="320" height="220" transform="translate(0 -300)"/>
    <rect class="head" width="320" height="42" transform="translate(0 -300)"/>
    <text x="18" y="-273" class="title">sentiment_analysis</text>
    <circle class="pk" cx="18" cy="-235" r="6"/><text x="35" y="-230" class="field">sentiment_id BIGINT PK</text>
    <circle class="fk" cx="18" cy="-208" r="6"/><text x="35" y="-203" class="field">article_id BIGINT FK</text>
    <circle class="col" cx="18" cy="-181" r="6"/><text x="35" y="-176" class="field">sentiment_label ENUM</text>
    <circle class="col" cx="18" cy="-154" r="6"/><text x="35" y="-149" class="field">sentiment_score TINYINT</text>
    <circle class="col" cx="18" cy="-127" r="6"/><text x="35" y="-122" class="field">confidence DECIMAL</text>
    <circle class="col" cx="18" cy="-100" r="6"/><text x="35" y="-95" class="field">analyzed_model, analyzed_at</text>
  </g>
</svg>
